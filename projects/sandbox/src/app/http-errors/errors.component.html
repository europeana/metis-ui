@if (isShowing()) {
<div class="error-container" [ngClass]="{ critical: statusCode() === 500 }">
  <div class="error-header">
    <span class="status-code">Error {{ statusCode() }}</span>
    <button class="close-btn" (click)="close()">&times;</button>
  </div>
  <div class="error-body">
    {{ errorMessage() }}
  </div>
</div>
}
