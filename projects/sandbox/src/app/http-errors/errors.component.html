@let errorResponse = error(); @let fnOnClose = onClose(); @if(errorResponse) {
<div class="errors">
  @let error = errorResponse.error; @if(fnOnClose) {
  <a class="close-errors" (click)="fnOnClose()"></a>
  }
  <div class="heading">
    {{ errorResponse.status }}
    {{ error ? error.status : '' }}
  </div>
  <ul class="error-detail">
    @if(error && error.message){
    <li>{{ error.message }}</li>
    }
    <li>{{ errorResponse.message }}</li>
  </ul>
</div>
}
