<span class="{{ hostClasses() }}" (click)="valueBump()">
  <ng-template #tmpSelectAll>
    <lib-checkbox
      [disabled]="selectAllDisabled()"
      [checked]="allSelectedState()"
      (valueChanged)="toggleSelectAll()"
    ></lib-checkbox>
  </ng-template>

  @if (conf().translateKey; as key) {
  <span class="state-arrow">{{ key | translate }}</span>
  } @else {
  <ng-container *ngTemplateOutlet="tmpSelectAll"></ng-container>
  }
</span>
