<span class="{{ conf.cssClass }} {{ classes[current] }}" (click)="valueBump()">
  <ng-template #tmpSelectAll>
    <lib-checkbox
      [disabled]="selectAllDisabled"
      [checked]="allSelected"
      (valueChanged)="toggleSelectAll()"
    ></lib-checkbox>
  </ng-template>
  @if (conf.translateKey) {
  <span class="state-arrow">{{ conf.translateKey | translate }}</span>
  } @else {
  <ng-container *ngTemplateOutlet="tmpSelectAll"></ng-container>
  }
</span>
