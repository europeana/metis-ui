<div class="view-sample" [ngClass]="mergedClasses()">
  <div class="view-sample-title">
    @if (editorConfig()) {
    <div class="title-controls">
      <ng-template #defaultTitle>
        <h3>
          {{ title() }}
        </h3>
      </ng-template>

      @if (isSearchEditor()) {
      <!-- Synchronized with your updated child app-search model inputs -->
      <app-search
        class="app-search"
        [executeEmpty]="true"
        [inputId]="'search_xml'"
        [label]="searchTerm() ? searchTerm() : title()"
        [loading]="loading()"
        [placeholderKey]="'previewSearchRecords' | translate"
        [reversed]="true"
        [(searchString)]="searchTerm"
        (executed)="search($event)"
      ></app-search>
      } @else {
      <ng-container *ngTemplateOutlet="defaultTitle"></ng-container>
      } @if (!themeDisabled()) {
      <app-editor-drop-down
        class="app-editor-drop-down"
        (themeSet)="onThemeSet()"
        [editorIsDefaultTheme]="editorConfig()?.theme === 'default'"
        [xmlDownloads]="filteredXmlDownloads()"
      ></app-editor-drop-down>
      } @if (expandable() && expanded()) {
      <button
        class="editor-ctrl toggle-expand"
        tabindex="0"
        title="{{ 'minimise' | translate }}"
        (click)="toggle()"
        (keyup.enter)="toggle()"
      ></button>
      }
    </div>
    } @if (step()) {
    <span class="step-display">
      <span>{{ step() }}</span>
      @if (stepCompare()) {
      <span> {{ stepCompare() }}</span>
      }
    </span>
    }
  </div>

  <div [ngClass]="{ 'theme-midnight': editorConfig()?.theme !== 'default' }">
    <ng-content></ng-content>
  </div>

  @if (expandable()) {
  <div class="btns-set btns-set-right">
    @if (!expanded()) {
    <button class="load-more-btn" tabindex="0" (click)="toggle()">
      {{ 'expandInfo' | translate }}
    </button>
    }
  </div>
  }
</div>
