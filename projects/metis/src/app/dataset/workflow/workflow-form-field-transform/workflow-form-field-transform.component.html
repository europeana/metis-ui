<ng-template #fieldInput let-disabled="disabled">
  <div
    class="form-group form-group-checkbox"
    data-e2e="custom-xslt-container"
    [formGroup]="workflowForm()"
  >
    <lib-checkbox
      [form]="workflowForm()"
      [controlName]="ParameterFieldName.customXslt"
      [labelText]="'customXslt' | translate"
      [disabled]="disabled || !customXsltAllowed()"
    ></lib-checkbox>
  </div>
</ng-template>

@if (workflowForm().get(conf().name)!.disabled || !workflowForm().get(conf().name)!.value) {
<span class="show-on-hover">
  <ng-container
    [ngTemplateOutlet]="fieldInput"
    [ngTemplateOutletContext]="{ disabled: true }"
  ></ng-container>
</span>
} @if (!workflowForm().get('pluginTRANSFORMATION')!.disabled &&
workflowForm().get('pluginTRANSFORMATION')!.value) {
<div>
  <ng-container
    [ngTemplateOutlet]="fieldInput"
    [ngTemplateOutletContext]="{ disabled: false }"
  ></ng-container>
</div>
}
