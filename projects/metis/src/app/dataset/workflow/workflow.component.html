<div class="metis-form metis-form-horizontal workflow-form">
  <form [formGroup]="workflowForm">
    <div class="form-fields-container">
      @for (conf of fieldConf; track conf.label; let i = $index) { @if (conf.dragType !==
      DragTypeEnum.dragSource) {
      <app-workflow-form-field
        [conf]="conf"
        [index]="i"
        [workflowForm]="workflowForm"
        (setLinkCheck)="setLinkCheck($event)"
        [incrementalHarvestingAllowed]="incrementalHarvestingAllowed()"
        [customXsltAllowed]="datasetData() && !!datasetData().xsltId"
      ></app-workflow-form-field>
      } }

      <div class="form-fields form-fields-buttons">
        @if(newWorkflow() || formIsDirty() || isSaving()){
        <div
          class="form-group form-group-btns"
          [ngClass]="{ 'warning-before': saveNotification() }"
        >
          <app-notification
            variant="small"
            [notification]="saveNotificationSignal()"
            [unclosable]="true"
          ></app-notification>

          <div class="spacer"></div>

          @if(!newWorkflow()){
          <button
            type="button"
            class="button-outline"
            [disabled]="isSaving() || !formIsDirty()"
            (click)="reset()"
          >
            {{ 'reset' | translate }}
          </button>
          }
          <app-loading-button
            classes="submit button-filled"
            data-e2e="save-workflow"
            [disabled]="!workflowForm.valid || !formIsDirty()"
            title="{{ 'save' | translate }}"
            loadingTitle="{{ 'saving' | translate }}"
            (onClick)="onSubmit()"
          ></app-loading-button>
        </div>
        } @if(!newWorkflow() && !formIsDirty() && !isSaving()){
        <div class="form-group form-group-btns">
          <app-notification
            variant="small"
            [notification]="runNotificationSignal()"
            (closed)="notification.set(undefined)"
          ></app-notification>
          <div class="spacer"></div>

          <app-loading-button
            classes="submit button-filled"
            [disabled]="isRunning()"
            [isLoading]="isStarting()"
            title="{{ 'runWorkflow' | translate }}"
            loadingTitle="{{ 'starting' | translate }}"
            (onClick)="start()"
          ></app-loading-button>
        </div>
        }
      </div>
    </div>
  </form>
</div>
