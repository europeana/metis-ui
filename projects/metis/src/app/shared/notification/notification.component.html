@if (notification()) {
<button
  [disabled]="unclosable()"
  class="messages messages-{{ variant() }}"
  (keydown.enter)="close()"
  (click)="close()"
>
  <span
    class="notification {{
      notification()
        ?.type?.toString()
        ?.toLowerCase()
    }}-notification {{ notification()?.sticky ? 'notification-sticky' : '' }} {{
      hidden() ? 'notification-hidden' : ''
    }}"
  >
    {{ notification()?.content }}
  </span>
</button>
}
