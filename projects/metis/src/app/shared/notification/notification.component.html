@if(notification){
<div
  class="messages messages-{{ variant }}"
  (keydown.enter)="close()"
  role="button"
  tabindex="0"
  (click)="close()"
>
  <div
    class="notification {{ notification.type.toString().toLowerCase() }}-notification {{
      notification.sticky ? 'notification-sticky' : ''
    }} {{ hidden ? 'notification-hidden' : '' }}"
  >
    {{ notification.content }}
  </div>
</div>
}
