<button
  (click)="click()"
  type="{{ type() }}"
  [class]="classes()"
  [attr.disabled]="disabled() || isLoading() ? 'disabled' : null"
>
  @if (isLoading()) {
  <span class="loading-button-spinner"></span>
  }
  <span>{{ isLoading() && loadingTitle() ? loadingTitle() : title() }}</span>
</button>
