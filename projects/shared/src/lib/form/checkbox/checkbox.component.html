<div class="lib-checkbox-wrapper" [class.lib-checkbox-disabled]="disabled()">
  <label class="lib-checkbox-label">
    <input
      type="checkbox"
      [checked]="isChecked()"
      [disabled]="disabled()"
      (change)="toggle()"
      (blur)="onTouched()"
    />
    <span class="lib-checkbox-tick"></span>
    @if (labelText()) {
    <span class="lib-checkbox-text">{{ labelText() }}</span>
    }
  </label>
</div>
