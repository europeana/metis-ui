<div class="lib-file-upload">
  <!-- Hidden native input -->
  <input
    #fileUpload
    type="file"
    [accept]="acceptedTypes()"
    (change)="emitFiles($event)"
    [disabled]="disabled()"
    style="display: none"
  />

  <div class="input-group">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="fileUpload.click()"
      [disabled]="disabled()"
    >
      <span class="icon-browse"></span>
      <span i18n="Browse button|label for file picker@@browseFiles">Browse...</span>
    </button>

    <div class="file-info-wrapper">
      @if (selectedFileName()) {
        <span class="file-name">{{ selectedFileName() }}</span>
        <button type="button" class="btn-clear" (click)="clearFileValue()" aria-label="Clear file">
          &times;
        </button>
      } @else {
        <span class="placeholder" i18n="File placeholder@@noFileSelected">No file selected</span>
      }
    </div>
  </div>
</div>
