name: '- helper (sonar)'
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_ref:
        type: string
        required: false
        default: ''
      pr_base_ref:
        type: string
        required: false
        default: ''

jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || inputs.pr_head_ref || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Get Metis LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovMetisUI
          path: ./sonar-reports

      - name: Get Sandbox LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovSandboxUI
          path: ./sonar-reports

      - name: Get Shared LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovShared
          path: ./sonar-reports

      - run: |
          cp ./sonar-reports/metis.info ./metis.info || echo "metis file missing"
          cp ./sonar-reports/sandbox.info ./sandbox.info || echo "sandbox file missing"
          cp ./sonar-reports/shared.info ./shared.info || echo "shared file missing"

      - name: Align Monorepo Coverage Targets
        run: |
          sed -i 's|SF:/home/runner/work/metis-ui/metis-ui/|SF:|g' ./metis.info
          sed -i 's|SF:/home/runner/work/metis-ui/metis-ui/|SF:|g' ./sandbox.info
          sed -i 's|SF:/home/runner/work/metis-ui/metis-ui/|SF:|g' ./shared.info
          sed -i 's|SF:src/|SF:projects/sandbox/src/|g' ./sandbox.info
          sed -i 's|SF:\./src/|SF:projects/sandbox/src/|g' ./sandbox.info
          sed -i 's|SF:src/|SF:projects/shared/src/|g' ./shared.info
          sed -i 's|SF:\./src/|SF:projects/shared/src/|g' ./shared.info

      - name: Resolve Pull Request Context
        id: pr_ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.inputs.tag_name || inputs.pr_head_ref || github.event.pull_request.head.ref }}
        run: |
          NATIVE_PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [ -n "$NATIVE_PR" ]; then
            echo "number=$NATIVE_PR" >> $GITHUB_OUTPUT
            echo "head_ref=${{ github.event.pull_request.head.ref || inputs.pr_head_ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ github.event.pull_request.base.ref || inputs.pr_base_ref }}" >> $GITHUB_OUTPUT
          else
            PR_DATA=$(gh pr list --head "$BRANCH_NAME" --state open --json number,headRefName,baseRefName --jq '.[] | "\(.number) \(.headRefName) \(.baseRefName)"')
            if [ -n "$PR_DATA" ]; then
              read -r PR_NUM PR_HEAD PR_BASE <<< "$PR_DATA"
              echo "number=$PR_NUM" >> $GITHUB_OUTPUT
              echo "head_ref=$PR_HEAD" >> $GITHUB_OUTPUT
              echo "base_ref=$PR_BASE" >> $GITHUB_OUTPUT
            else
              echo "number=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # FIX: Passing the core project definitions explicitly via native environment hooks
          # completely prevents the wrapper from dropping or misinterpreting your project properties!
          SONAR_ORGANIZATION: europeana
          SONAR_PROJECT_KEY: europeana_metis-ui
        with:
          projectBaseDir: .
          args: |
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.key={0}', steps.pr_ctx.outputs.number) || '' }}
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.branch={0}', steps.pr_ctx.outputs.head_ref) || '' }}
            ${{ secrets.METIS_FRONTEND_SONAR_TOKEN && steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.base={0}', steps.pr_ctx.outputs.base_ref) || '' }}
