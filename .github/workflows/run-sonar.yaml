name: '- helper (sonar)'
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_ref:
        type: string
        required: false
        default: ''
      pr_base_ref:
        type: string
        required: false
        default: ''

jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_ref || github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Fetch Target Base Branch for Git Diff Detection
        run: |
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch --tags --prune --unshallow origin ${{ inputs.pr_base_ref || 'develop' }} || git fetch --tags --prune origin ${{ inputs.pr_base_ref || 'develop' }}

      - name: Download All Monorepo Test Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./sonar-reports

      - name: Align Monorepo Coverage Target Paths
        run: |
          echo "=== Aligning Internal LCOV Paths for Monorepo Projects ==="

          # Find and patch any lcov files anywhere inside the ./sonar-reports directory
          find ./sonar-reports -name "lcov.info" | while read -r lcov_file; do
            echo "Processing coverage file: $lcov_file"
            sed -i 's|SF:dist/test-out/[^/]*/projects/|SF:projects/|g' "$lcov_file"
            sed -i 's|SF:.*projects/|SF:projects/|g' "$lcov_file"
          done

      - name: Resolve Pull Request Context
        id: pr_ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ inputs.pr_number || github.event.pull_request.number }}"
          PR_HEAD="${{ inputs.pr_head_ref || github.event.pull_request.head.ref }}"
          PR_BASE="${{ inputs.pr_base_ref || github.event.pull_request.base.ref }}"

          if [ -z "$PR_NUM" ] && [[ "${{ github.ref }}" == refs/pull/* ]]; then
            PR_NUM=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}')
            PR_HEAD="${{ github.head_ref }}"
            PR_BASE="${{ github.base_ref }}"
          fi

          if [ -z "$PR_NUM" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
            PR_DATA=$(gh pr list --head "$BRANCH_NAME" --state open --json number,headRefName,baseRefName --jq '.[] | "\(.number) \(.headRefName) \(.baseRefName)"' | head -n 1)
            if [ -n "$PR_DATA" ]; then
              read -r PR_NUM PR_HEAD PR_BASE <<< "$PR_DATA"
            fi
          fi

          if [ -n "$PR_NUM" ]; then
            echo "number=$PR_NUM" >> $GITHUB_OUTPUT
            echo "head_ref=$PR_HEAD" >> $GITHUB_OUTPUT
            echo "base_ref=$PR_BASE" >> $GITHUB_OUTPUT
          else
            echo "number=" >> $GITHUB_OUTPUT
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: |
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=europeana
            -Dsonar.projectKey=europeana_metis-ui
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.cy.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/_mocked/**
            -Dsonar.sources=projects/metis/src,projects/sandbox/src,projects/shared/src
            -Dsonar.javascript.lcov.reportPaths=./sonar-reports/appLcovMetisUI/lcov.info,./sonar-reports/appLcovSandboxUI/lcov.info,./sonar-reports/appLcovShared/lcov.info
            -Dsonar.pullrequest.key=${{ inputs.pr_number || github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ inputs.pr_head_ref || github.event.pull_request.head.ref || github.head_ref }}
            -Dsonar.pullrequest.base=${{ inputs.pr_base_ref || github.event.pull_request.base.ref || github.base_ref }}
