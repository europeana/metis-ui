name: '- helper (sonar)'
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_ref:
        type: string
        required: false
        default: ''
      pr_base_ref:
        type: string
        required: false
        default: ''

jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_ref || github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      # Strips shallow history limits so Sonar can calculate code diff metrics natively
      - name: Fetch Target Base Branch for Git Diff Detection
        run: |
          git fetch --no-tags --prune --depth=100 origin ${{ inputs.pr_base_ref || 'develop' }}:${{ inputs.pr_base_ref || 'develop' }}

      - name: Get Metis LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovMetisUI
          path: ./sonar-reports

      - name: Get Sandbox LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovSandboxUI
          path: ./sonar-reports

      - name: Get Shared LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovShared
          path: ./sonar-reports

      - run: |
          cp ./sonar-reports/metis.info ./metis.info || echo "metis file missing"
          cp ./sonar-reports/sandbox.info ./sandbox.info || echo "sandbox file missing"
          cp ./sonar-reports/shared.info ./shared.info || echo "shared file missing"

      # Strips out Angular's virtual virtualized memory directories from internal traces
      - name: Align Monorepo Coverage Target Paths
        run: |
          echo "=== Aligning Internal LCOV Paths for Sonar Monorepo Scanning ==="
          if [ -f "./sandbox.info" ]; then
            sed -i 's|SF:dist/test-out/[^/]*/projects/|SF:projects/|g' ./sandbox.info
          fi
          if [ -f "./shared.info" ]; then
            sed -i 's|SF:dist/test-out/[^/]*/projects/|SF:projects/|g' ./shared.info
          fi

      - name: Resolve Pull Request Context
        id: pr_ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ inputs.pr_number || github.event.pull_request.number }}"
          PR_HEAD="${{ inputs.pr_head_ref || github.event.pull_request.head.ref }}"
          PR_BASE="${{ inputs.pr_base_ref || github.event.pull_request.base.ref }}"

          if [ -z "$PR_NUM" ] && [[ "${{ github.ref }}" == refs/pull/* ]]; then
            PR_NUM=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}')
            PR_HEAD="${{ github.head_ref }}"
            PR_BASE="${{ github.base_ref }}"
          fi

          if [ -z "$PR_NUM" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
            PR_DATA=$(gh pr list --head "$BRANCH_NAME" --state open --json number,headRefName,baseRefName --jq '.[] | "\(.number) \(.headRefName) \(.baseRefName)"' | head -n 1)
            if [ -n "$PR_DATA" ]; then
              read -r PR_NUM PR_HEAD PR_BASE <<< "$PR_DATA"
            fi
          fi

          if [ -n "$PR_NUM" ]; then
            echo "number=$PR_NUM" >> $GITHUB_OUTPUT
            echo "head_ref=$PR_HEAD" >> $GITHUB_OUTPUT
            echo "base_ref=$PR_BASE" >> $GITHUB_OUTPUT
          else
            echo "number=" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install and Run Native Sonar Scanner
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SONAR_SCANNER_VERSION=6.1.0.4477
          curl -sSLo ./sonar-scanner.zip "https://sonarsource.com{SONAR_SCANNER_VERSION}-linux-x64.zip"
          unzip -q ./sonar-scanner.zip
          export PATH=$PWD/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64/bin:$PATH

          # 1. DEBUG: Print current working directory and first few lines of lcov files to check 'SF:' paths
          echo "=== Debugging runner filesystem paths ==="
          pwd
          [ -f "./metis.info" ] && head -n 5 ./metis.info
          [ -f "./sandbox.info" ] && head -n 5 ./sandbox.info
          [ -f "./shared.info" ] && head -n 5 ./shared.info

          # Dynamically builds the reports flag string depending on which files successfully copied
          REPORTS=""
          [ -f "./metis.info" ] && REPORTS="metis.info"
          [ -f "./sandbox.info" ] && REPORTS="${REPORTS:+$REPORTS,}sandbox.info"
          [ -f "./shared.info" ] && REPORTS="${REPORTS:+$REPORTS,}shared.info"

          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=europeana \
            -Dsonar.projectKey=europeana_metis-ui \
            -Dsonar.ws.timeout=300 \
            -Dsonar.sources=projects \
            ${REPORTS:+-Dsonar.javascript.lcov.reportPaths=$REPORTS} \
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', steps.pr_ctx.outputs.number, steps.pr_ctx.outputs.head_ref, steps.pr_ctx.outputs.base_ref) || '' }}
