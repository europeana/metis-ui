name: '- helper (sonar)'
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_ref:
        type: string
        required: false
        default: ''
      pr_base_ref:
        type: string
        required: false
        default: ''

jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || inputs.pr_head_ref || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Get Metis LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovMetisUI
          path: ./lcov-metis-ui.info

      - name: Get Sandbox LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovSandboxUI
          path: ./lcov-sandbox-ui.info

      - name: Get Shared LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovShared
          path: ./lcov-shared.info

      - run: cp ./lcov-shared.info/lcov-shared.info ./shared.info
      - run: cp ./lcov-sandbox-ui.info/lcov-sandbox-ui.info ./sandbox.info
      - run: cp ./lcov-metis-ui.info/lcov-metis-ui.info ./metis.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Look for passed inputs first, fall back to native event payloads next
          SONAR_PR_KEY: ${{ inputs.pr_number || github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ inputs.pr_head_ref || github.event.pull_request.head.ref }}
          SONAR_PR_BASE: ${{ inputs.pr_base_ref || github.event.pull_request.base.ref }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=europeana
            -Dsonar.projectKey=europeana_metis-ui
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.sources=projects/metis/src/app,projects/sandbox/src/app,projects/shared/src/lib
            -Dsonar.exclusions=projects/**/src/**/_mocked/**
            -Dsonar.javascript.lcov.reportPaths=./metis.info,./sandbox.info,./shared.info
            -Dsonar.pullrequest.key=${{ env.SONAR_PR_KEY }}
            -Dsonar.pullrequest.branch=${{ env.SONAR_PR_BRANCH }}
            -Dsonar.pullrequest.base=${{ env.SONAR_PR_BASE }}
