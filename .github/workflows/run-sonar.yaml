name: '- helper (sonar)'
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_ref:
        type: string
        required: false
        default: ''
      pr_base_ref:
        type: string
        required: false
        default: ''

jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      # 1. Clean checkout step that targets whatever branch parameter is passed in dynamically
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_ref || github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Get Metis LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovMetisUI
          path: ./sonar-reports

      - name: Get Sandbox LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovSandboxUI
          path: ./sonar-reports

      - name: Get Shared LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovShared
          path: ./sonar-reports

      - run: |
          cp ./sonar-reports/metis.info ./metis.info || echo "metis file missing"
          cp ./sonar-reports/sandbox.info ./sandbox.info || echo "sandbox file missing"
          cp ./sonar-reports/shared.info ./shared.info || echo "shared file missing"

      - name: Align Monorepo Coverage Targets
        run: |
          echo "==== Processing metis.info ===="
          sed -i 's|SF:.*projects/metis/|SF:projects/metis/|g' ./metis.info || echo "metis fail"

          echo "==== Processing sandbox.info ===="
          sed -i 's|SF:.*projects/sandbox/|SF:projects/sandbox/|g' ./sandbox.info || echo "sandbox fail"
          sed -i 's|SF:src/|SF:projects/sandbox/src/|g' ./sandbox.info
          sed -i 's|SF:\./src/|SF:projects/sandbox/src/|g' ./sandbox.info

          echo "==== Processing shared.info ===="
          sed -i 's|SF:.*projects/shared/|SF:projects/shared/|g' ./shared.info || echo "shared fail"
          sed -i 's|SF:src/|SF:projects/shared/src/|g' ./shared.info
          sed -i 's|SF:\./src/|SF:projects/shared/src/|g' ./shared.info

      - name: Resolve Pull Request Context
        id: pr_ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.inputs.tag_name || inputs.pr_head_ref || github.event.pull_request.head.ref }}
        run: |
          NATIVE_PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [ -n "$NATIVE_PR" ]; then
            echo "number=$NATIVE_PR" >> $GITHUB_OUTPUT
            echo "head_ref=${{ github.event.pull_request.head.ref || inputs.pr_head_ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ github.event.pull_request.base.ref || inputs.pr_base_ref }}" >> $GITHUB_OUTPUT
          else
            PR_DATA=$(gh pr list --head "$BRANCH_NAME" --state open --json number,headRefName,baseRefName --jq '.[] | "\(.number) \(.headRefName) \(.baseRefName)"')
            if [ -n "$PR_DATA" ]; then
              read -r PR_NUM PR_HEAD PR_BASE <<< "$PR_DATA"
              echo "number=$PR_NUM" >> $GITHUB_OUTPUT
              echo "head_ref=$PR_HEAD" >> $GITHUB_OUTPUT
              echo "base_ref=$PR_BASE" >> $GITHUB_OUTPUT
            else
              echo "number=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install and Run Native Sonar Scanner
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SONAR_SCANNER_VERSION=6.1.0.4477

          # Download from the correct binaries server with the complete path mapping
          curl -sSLo ./sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip"

          unzip -q ./sonar-scanner.zip
          export PATH=$PWD/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64/bin:$PATH

          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=europeana \
            -Dsonar.projectKey=europeana_metis-ui \
            -Dsonar.ws.timeout=300 \
            -Dsonar.sources=projects \
            -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.cy.ts \
            -Dsonar.javascript.lcov.reportPaths=metis.info,sandbox.info,shared.info \
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', steps.pr_ctx.outputs.number, steps.pr_ctx.outputs.head_ref, steps.pr_ctx.outputs.base_ref) || '' }}
