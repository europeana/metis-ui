name: '- helper (sonar)'
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_ref:
        type: string
        required: false
        default: ''
      pr_base_ref:
        type: string
        required: false
        default: ''

jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_ref || github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      # Strips shallow history limits so Sonar can calculate code diff metrics natively
      - name: Fetch Target Base Branch for Git Diff Detection
        run: |
          git fetch --no-tags --prune --depth=100 origin ${{ inputs.pr_base_ref || 'develop' }}:${{ inputs.pr_base_ref || 'develop' }}

      # Clear out the obsolete cp block completely since the file is already in place

      # Strips out Angular's virtual virtualized memory directories from internal traces
      - name: Align Monorepo Coverage Target Paths
        run: |
          echo "=== Aligning Internal LCOV Paths for Sonar Monorepo Scanning ==="
          if [ -f "./sonar-reports/lcov.info" ]; then
            # Clean up path prefixes inside the single actual file
            sed -i 's|SF:dist/test-out/[^/]*/projects/|SF:projects/|g' ./sonar-reports/lcov.info
          fi

      - name: Resolve Pull Request Context
        id: pr_ctx
        # (Keep your existing pr_ctx block intact here)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install and Run Native Sonar Scanner
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SONAR_SCANNER_VERSION=6.1.0.4477
          curl -sSLo ./sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip"
          unzip -q ./sonar-scanner.zip
          export PATH=$PWD/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64/bin:$PATH
          sonar-scanner \
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', steps.pr_ctx.outputs.number, steps.pr_ctx.outputs.head_ref, steps.pr_ctx.outputs.base_ref) || '' }}
