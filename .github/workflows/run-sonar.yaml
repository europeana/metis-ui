name: '- helper (sonar)'
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_ref:
        type: string
        required: false
        default: ''
      pr_base_ref:
        type: string
        required: false
        default: ''

jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || inputs.pr_head_ref || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Get Metis LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovMetisUI
          path: ./
          merge-multiple: true

      - name: Get Sandbox LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovSandboxUI
          path: ./
          merge-multiple: true

      - name: Get Shared LCOV
        uses: actions/download-artifact@v4
        with:
          name: appLcovShared
          path: ./
          merge-multiple: true

      # Explicitly rename the files from their uploaded filenames to the Sonar targets safely
      - run: |
          mv ./lcov-metis-ui.info ./metis.info || echo "metis file not found"
          mv ./lcov-sandbox-ui.info ./sandbox.info || echo "sandbox file not found"
          mv ./lcov-shared.info ./shared.info || echo "shared file not found"

      # PATH CONVERSION: Converts Vitest's local paths into explicit Monorepo paths
      - name: Align Monorepo Coverage Targets
        run: |
          if [ -f "./sandbox.info" ]; then
            echo "Aligning sandbox paths..."
            sed -i 's|SF:src/|SF:projects/sandbox/src/|g' ./sandbox.info
            sed -i 's|SF:\./src/|SF:projects/sandbox/src/|g' ./sandbox.info
          fi
          if [ -f "./shared.info" ]; then
            echo "Aligning shared paths..."
            sed -i 's|SF:src/|SF:projects/shared/src/|g' ./shared.info
            sed -i 's|SF:\./src/|SF:projects/shared/src/|g' ./shared.info
          fi

      # DYNAMIC STEP: Resolves the missing PR data via GitHub's API when triggered manually
      - name: Resolve Pull Request Context
        id: pr_ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.inputs.tag_name || inputs.pr_head_ref || github.event.pull_request.head.ref }}
        run: |
          NATIVE_PR="${{ github.event.pull_request.number || inputs.pr_number }}"

          if [ -n "$NATIVE_PR" ]; then
            echo "Using native pull request context: #$NATIVE_PR"
            echo "number=$NATIVE_PR" >> $GITHUB_OUTPUT
            echo "head_ref=${{ github.event.pull_request.head.ref || inputs.pr_head_ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ github.event.pull_request.base.ref || inputs.pr_base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "Manual run detected. Searching for open PRs linked to branch: $BRANCH_NAME..."

            # FIXED: Added the required --json parameter to satisfy the template compiler
            PR_DATA=$(gh pr list --head "$BRANCH_NAME" --state open --json number,headRefName,baseRefName --template '{{range .}}{{echo .number}}{{echo " "}}{{echo .headRefName}}{{echo " "}}{{echo .baseRefName}}{{echo "\n"}}{{end}}')

            if [ -n "$PR_DATA" ]; then
              read -r PR_NUM PR_HEAD PR_BASE <<< "$PR_DATA"
              echo "Found matching open PR: #$PR_NUM"
              echo "number=$PR_NUM" >> $GITHUB_OUTPUT
              echo "head_ref=$PR_HEAD" >> $GITHUB_OUTPUT
              echo "base_ref=$PR_BASE" >> $GITHUB_OUTPUT
            else
              echo "No open PR found for branch $BRANCH_NAME. Falling back to standard branch scan."
              echo "number=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: /home/runner/work/metis-ui/metis-ui
          args: |
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=europeana
            -Dsonar.projectKey=europeana_metis-ui
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.sources=projects/metis/src/app,projects/sandbox/src/app,projects/shared/src/lib
            -Dsonar.exclusions=projects/**/src/**/_mocked/**
            -Dsonar.javascript.lcov.reportPaths=./metis.info,./sandbox.info,./shared.info
            -Dsonar.scm.exclusions.disabled=true
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.key={0}', steps.pr_ctx.outputs.number) || '' }}
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.branch={0}', steps.pr_ctx.outputs.head_ref) || '' }}
            ${{ steps.pr_ctx.outputs.number && format('-Dsonar.pullrequest.base={0}', steps.pr_ctx.outputs.base_ref) || '' }}
