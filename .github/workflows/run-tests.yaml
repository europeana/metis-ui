name: '- helper (unit testing)'
on: workflow_call

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'

      - run: npm install
      - run: npm run build-shared
      - run: npm run test:dev

      # Safely find the nested metis file and pull it out into the flat folder path
      - name: Flatten Metis Coverage Directory
        run: |
          find projects/metis/coverage -name "lcov.info" -exec cp {} projects/metis/coverage/lcov.info \; || echo "No metis lcov found"

      - name: Upload Metis Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: applcovMetisUI
          path: projects/metis/coverage/lcov.info
          if-no-files-found: error

      - name: Upload Sandbox Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: applcovSandboxUI
          path: projects/sandbox/coverage/lcov.info
          if-no-files-found: error

      - name: Upload Shared Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: applcovSharedUI
          path: projects/shared/coverage/lcov.info
          if-no-files-found: error
