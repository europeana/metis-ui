name: '- helper (unit testing)'
on: workflow_call

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'

      - run: npm install
      - run: npm run build-shared
      - run: npm run test:dev

      # Safely find the metis lcov file wherever Karma dropped it and stage it
      - name: Stage Metis Coverage
        run: |
          mkdir -p projects/metis/coverage-flat
          find projects/metis/coverage -name "lcov.info" -exec cp {} projects/metis/coverage-flat/lcov.info \;

      - uses: actions/upload-artifact@v4
        with:
          name: applcovMetisUI
          path: projects/metis/coverage-flat/lcov.info
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: applcovSandboxUI
          path: projects/sandbox/coverage/lcov.info
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: applcovSharedUI
          path: projects/shared/coverage/lcov.info
          if-no-files-found: error
