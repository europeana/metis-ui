name: '- helper (unit testing)'
on: workflow_call

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'

      - run: npm install
      - run: npm run build-shared
      - run: npm run test:dev

      # Upload the exact file SonarQube expects, using the case-sensitive name from the error logs
      - uses: actions/upload-artifact@v4
        with:
          name: applcovMetisUI
          path: projects/metis/coverage/lcov.info
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: applcovSandboxUI
          path: projects/sandbox/coverage/lcov.info
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: applcovSharedUI
          path: projects/shared/coverage/lcov.info
          if-no-files-found: error
