      - run: |
          mkdir -p ./sonar-reports
          cp projects/metis/coverage/**/lcov.info ./sonar-reports/metis.info || touch ./sonar-reports/metis.info
          cp projects/sandbox/coverage/lcov.info ./sonar-reports/sandbox.info || touch ./sonar-reports/sandbox.info
          cp projects/shared/coverage/lcov.info ./sonar-reports/shared.info || touch ./sonar-reports/shared.info

      - uses: actions/upload-artifact@v4
        with:
          name: appLcovMetisUI
          path: ./sonar-reports/metis.info
