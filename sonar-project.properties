sonar.host.url=https://sonarcloud.io
sonar.organization=europeana
sonar.projectKey=europeana_metis-ui
sonar.ws.timeout=300

# Explicitly divide your executable code from your test directories
sonar.sources=projects/metis/src,projects/sandbox/src,projects/shared/src
sonar.tests=projects/metis/src,projects/sandbox/src,projects/shared/src

# This explicitly restricts test classification ONLY to files ending in .spec.ts
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=./sonar-reports/lcov.info
