# Monorepo Structure Configuration
sonar.sources=projects
sonar.inclusions=metis/src/app/**/*,sandbox/src/app/**/*,shared/src/lib/**/*
sonar.exclusions=**/src/**/_mocked/**
sonar.test.inclusions=**/*.spec.ts

# Coverage Tracking Targets
sonar.javascript.lcov.reportPaths=coverage/metis/lcov.info,coverage/sandbox/lcov.info,coverage/shared/lcov.info
sonar.scm.exclusions.disabled=true
sonar.ws.timeout=300
