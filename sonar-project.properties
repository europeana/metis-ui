sonar.host.url=https://sonarcloud.io
sonar.organization=europeana
sonar.projectKey=europeana_metis-ui
sonar.ws.timeout=300

# Expanded directories to capture base src folders alongside apps and libs
sonar.sources=projects/metis/src,projects/sandbox/src,projects/shared/src
