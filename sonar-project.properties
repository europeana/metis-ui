# Monorepo Structure Configuration
sonar.sources=projects
sonar.inclusions=projects/metis/src/app/**/*,projects/sandbox/src/app/**/*,projects/shared/src/lib/**/*
sonar.exclusions=projects/**/src/**/_mocked/**
sonar.test.inclusions=**/*.spec.ts

# Coverage Tracking Targets
sonar.javascript.lcov.reportPaths=./metis.info,./sandbox.info,./shared.info
sonar.scm.exclusions.disabled=true
sonar.ws.timeout=300
